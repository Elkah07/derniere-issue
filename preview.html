<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dossier Classé · Aperçu</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#f4f1e7;background:#080b0e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#2a1a19 0,transparent 35%),linear-gradient(145deg,#090d10,#040506)}main{width:min(1100px,100%);margin:auto;padding:32px 18px 70px}header{padding:42px;border:1px solid #403c37;border-radius:28px;background:linear-gradient(135deg,#201919,#111719);box-shadow:0 30px 80px #0008}small{color:#db7d62;font-weight:900;letter-spacing:.16em}h1{font-size:clamp(3.6rem,12vw,8rem);line-height:.8;margin:22px 0}h1 span{color:#db7d62}p{line-height:1.65;color:#c7c0b4}.stats{display:flex;flex-wrap:wrap;gap:8px}.stats b{padding:8px 12px;border:1px solid #60443d;border-radius:99px;color:#f1b19f}.chapter{margin-top:26px;border:1px solid #302e2a;border-radius:22px;background:#111719cc;overflow:hidden}.chapter>button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:22px;color:#fff;border:0;background:none;text-align:left;cursor:pointer}.chapter h2{margin:0;font-size:1.5rem}.events{display:none;padding:0 18px 20px}.chapter.open .events{display:grid;gap:12px}.event{padding:18px;border-radius:16px;background:#191f20;border:1px solid #343b3a}.event.branch{border-color:#855443}.event h3{margin:0 0 8px}.tag{display:inline-block;margin-left:7px;padding:4px 7px;border-radius:99px;background:#6a3d32;color:#ffd8cd;font-size:.65rem}.choice{margin-top:7px;padding:9px 11px;border-left:3px solid #db7d62;background:#0e1214}.endings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}.ending{padding:20px;border:1px solid #493b37;border-radius:18px;background:#171718}.ending strong{display:block;font-size:1.05rem;margin-bottom:7px}.muted{color:#8f8a82}
</style></head><body><main><header><small>DERNIÈRE ISSUE · AVENTURE 02</small><h1>DOSSIER<br><span>CLASSÉ</span></h1><p id="premise"></p><div class="stats" id="stats"></div></header><section id="chapters"></section><h2>Les huit issues</h2><section class="endings" id="endings"></section></main>
<script type="module">import {dossierClasse as data} from './src/dossierClasse.js';
document.querySelector('#premise').textContent=data.premise;document.querySelector('#stats').innerHTML=[`${data.players.min}–${data.players.max} joueurs`,`${data.chapters.length} chapitres`,`${data.events.length} événements`,`${data.endings.length} issues`].map(x=>`<b>${x}</b>`).join('');
const root=document.querySelector('#chapters');data.chapters.forEach(ch=>{const sec=document.createElement('section');sec.className='chapter';const evs=data.events.filter(e=>e.chapter===ch.number&&!e.secondary);sec.innerHTML=`<button><span><small>CHAPITRE ${ch.number}</small><h2>${ch.icon} ${ch.title}</h2></span><b>＋</b></button><div class="events">${evs.map(e=>`<article class="event ${e.branch?'branch':''}"><h3>${e.title}${e.branch?'<span class="tag">BRANCHE</span>':''}</h3><p>${e.scene[0]}</p><div>${e.choices.map(c=>`<div class="choice"><strong>${c.label}</strong><br><span class="muted">${c.description}</span></div>`).join('')}</div></article>`).join('')}</div>`;sec.querySelector('button').onclick=()=>sec.classList.toggle('open');root.appendChild(sec)});
document.querySelector('#endings').innerHTML=data.endings.map(e=>`<article class="ending"><strong>${e.icon} ${e.title}</strong><p>${e.summary}</p></article>`).join('');</script></body></html>
